steps:
  # 1. Run unit tests
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']

  # 2. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:$COMMIT_SHA'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:latest'
      - '.'

  # 3. Push container image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:$COMMIT_SHA'

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'personal-gemini-journal'
      - '--image=$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:$COMMIT_SHA'
      - '--region=$_LOCATION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=production'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--service-account=gemini-journal-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-labels=dev-tutorial=cloud-run-ai-challenge'

substitutions:
  _LOCATION: 'us-central1'
  _REPO_NAME: 'gemini-apps'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:$COMMIT_SHA'
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/personal-gemini-journal:latest'

options:
  logging: CLOUD_LOGGING_ONLY
